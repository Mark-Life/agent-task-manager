# /etc/systemd/system/caddy.service.d/override.conf
#
# The stock caddy.service reads no environment file, so the `{$ATM_*}`
# placeholders in the Caddyfile would all resolve to empty strings — which
# adapts to a site with no address and serves nothing, without an error.

[Service]
EnvironmentFile=/etc/agent-task-manager/caddy.env
