services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-agent_task_manager}
    ports:
      # Bound to loopback only — never reachable off the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-agent_task_manager}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atm_postgres_data:
